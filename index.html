<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacman Experiment</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-labelledby="game-title">
      <section class="game-card" aria-describedby="game-status">
        <div class="game-header">
          <div>
            <h1 id="game-title">Pacman</h1>
            <p class="game-kicker">Static maze run</p>
          </div>
          <div class="hud" aria-label="Game status">
            <p class="hud-item">
              <span>Score</span>
              <strong id="score">0</strong>
            </p>
            <p class="hud-item">
              <span>Pellets</span>
              <strong id="pellets">0</strong>
            </p>
            <p class="hud-item">
              <span>Lives</span>
              <strong id="lives">3</strong>
            </p>
            <p class="hud-item">
              <span>Status</span>
              <strong id="game-status" role="status" aria-live="polite">Ready</strong>
            </p>
          </div>
        </div>

        <p class="sr-only" id="keyboard-help">
          Use arrow keys or W A S D to move. Press R or Enter to restart.
        </p>

        <div
          class="game-board"
          id="game-board"
          role="application"
          aria-label="Playable Pacman maze"
          aria-describedby="keyboard-help game-status"
          aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight W A S D R Enter"
          tabindex="0"
        >
          <div class="maze-grid" id="maze-grid" aria-hidden="true"></div>
          <div class="pacman-marker" id="player" aria-hidden="true"></div>
          <div class="ghost-layer" id="ghost-layer" aria-hidden="true"></div>
          <div class="game-message" id="game-message" hidden>
            <strong id="message-title"></strong>
            <span id="message-copy"></span>
          </div>
        </div>

        <div class="controls" aria-label="Game controls">
          <div class="direction-pad" aria-label="Movement controls">
            <button type="button" class="direction-button up" data-direction="up" aria-label="Move up">Up</button>
            <button type="button" class="direction-button left" data-direction="left" aria-label="Move left">Left</button>
            <button type="button" class="direction-button down" data-direction="down" aria-label="Move down">Down</button>
            <button type="button" class="direction-button right" data-direction="right" aria-label="Move right">Right</button>
          </div>
          <button type="button" id="restart-button">Restart</button>
        </div>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
