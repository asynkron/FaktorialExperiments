<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pac-Man Shell</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="game-title">
      <section class="game-card" aria-label="Pac-Man game shell">
        <header class="game-header">
          <div>
            <p class="eyebrow">Static browser scaffold</p>
            <h1 id="game-title">Pac-Man</h1>
          </div>
          <div class="hud" aria-label="Game status">
            <div class="hud-item">
              <span class="hud-label">Score</span>
              <span id="score" class="hud-value">0000</span>
            </div>
            <div class="hud-item">
              <span class="hud-label">Lives</span>
              <span id="lives" class="hud-value">3</span>
            </div>
          </div>
        </header>

        <div class="viewport-wrap">
          <section class="game-viewport" aria-label="Fixed Pac-Man game viewport">
            <div class="maze-grid" aria-hidden="true">
              <span class="wall top-left"></span>
              <span class="wall top-right"></span>
              <span class="wall middle-left"></span>
              <span class="wall middle-right"></span>
              <span class="wall bottom-left"></span>
              <span class="wall bottom-right"></span>
              <span class="pellet pellet-a"></span>
              <span class="pellet pellet-b"></span>
              <span class="pellet pellet-c"></span>
              <span class="pellet pellet-d"></span>
              <span class="pacman"></span>
              <span class="ghost ghost-a"></span>
              <span class="ghost ghost-b"></span>
            </div>
            <p id="game-status" class="game-status">Ready</p>
          </section>
        </div>

        <footer class="controls" aria-label="Game controls">
          <div class="button-row">
            <button id="start-button" type="button">Start</button>
            <button id="restart-button" type="button">Restart</button>
          </div>
          <div class="direction-panel" aria-live="polite">
            <span class="direction-label">Direction</span>
            <strong id="direction-display">None</strong>
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
